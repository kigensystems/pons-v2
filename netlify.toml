[build]
  base = "frontend"
  # The licensed Macintosh model stays in the repository for the Three.js comparison view but is not published.
  command = "npm run build && rm -rf dist/models"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--legacy-peer-deps"

# /api is proxied to the launch API on Render so the browser sees one origin: the HttpOnly session
# cookie and the API's Origin check work unchanged. `signed` names a site environment variable
# (scope: Runtime) holding a shared secret; Netlify signs every proxied request with it in x-nf-sign,
# and the API (PLUM_PROXY_SECRET, the same value) refuses anything unsigned, so it cannot be reached
# around the site. Change `to` if Render assigns a different hostname; see docs/DEPLOY.md.
[[redirects]]
  from = "/api/*"
  to = "https://plum-api-fg3l.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "PLUM_PROXY_SECRET"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output is immutable; the unhashed statics under stable names revalidate daily.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The site signs transactions, so nobody may frame it. Local dev servers send none of these,
# so the scratch iframe page used for mobile checks still works against 127.0.0.1.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
